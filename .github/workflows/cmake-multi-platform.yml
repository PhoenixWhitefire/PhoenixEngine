# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/assets"
      - ".github/wiki"
      - "wikigen/**"
      - "*.md"
      - "apidump.json"
      - "imgui.ini"
      - "debugger.layout.ini"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "wikigen/**"
      - "*.md"
      - "apidump.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [windows-latest]
        build_type: [Release, Debug]
        c_compiler: [cl, clang]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: clang
          - os: windows-latest
            build_type: ReleaseTSan
          - os: windows-latest
            build_type: DebugTSan
          - os: ubuntu-latest
            c_compiler: cl
          - os: ubuntu-latest
            build_type: DebugTSan

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        bash ./shell/chmod.sh
        ./shell/dependencies.sh

    - name: (Linux) Install Clang 19
      if: runner.os == 'Linux'
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: 19

    # - name: Setup PATH for Windows Address Sanitizer
    #   if: runner.os == 'Windows'
    #   shell: cmd
    #   run: call "C:\Program Files\Microsoft Visual Studio\2026\Enterprise\Common7\Tools\VsDevCmd.bat"

    - name: Configure CMake (Windows)
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      # TODO removing causes the wrong build type to be selected?
      if: runner.os == 'Windows'
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake --preset clang-linux

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build build -j4 --config ${{ matrix.build_type }}

    - name: Configure CMake for Profiler
      if: matrix.build_type == 'Release' && runner.os == 'Windows'
      run: cmake -B Vendor/tracy/profiler/build -S Vendor/tracy/profiler

    - name: Build Profiler
      if: matrix.build_type == 'Release' && runner.os == 'Windows'
      run: cmake --build Vendor/tracy/profiler/build --config Release -j4 -t tracy-profiler

    - name: Move executable and Wiki (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        move "build\\${{ matrix.build_type }}\\PhoenixEngine.exe" ".\\PhoenixEngine.exe"
        move ".github\\wiki" ".\\wiki"

    - name: Move executable and Wiki (Linux)
      if: runner.os == 'Linux'
      run: |
        mv "build/${{ matrix.build_type }}/PhoenixEngine" "./PhoenixEngine"
        mv "build/${{ matrix.build_type }}/PhoenixEngine.debug" "./PhoenixEngine.debug"
        mv ".github/wiki" "./wiki"

    - name: Upload build artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v6
      with:
        name: "Phoenix_${{ runner.os }}-${{ matrix.build_type }}"
        include-hidden-files: true
        path: |
          resources/
          plugins/
          wikigen/
          wiki/
          lsp/
          apidump.json
          default-layout.ini
          phoenix.conf
          Vendor/tracy/profiler/build/Release/tracy-profiler.exe
          README.md
          ADDITIONAL-COPYRIGHT-NOTICES.txt
          PhoenixEngine.exe
        retention-days: 7

    - name: Upload build artifact (Ubuntu)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v6
      with:
        name: "Phoenix_${{ runner.os }}-${{ matrix.build_type }}"
        include-hidden-files: true
        path: |
          resources/
          plugins/
          wikigen/
          wiki/
          lsp/
          apidump.json
          default-layout.ini
          phoenix.conf
          Vendor/tracy/profiler/build/tracy-profiler
          README.md
          ADDITIONAL-COPYRIGHT-NOTICES.txt
          PhoenixEngine
        retention-days: 7

    - name: install procdump (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile procdump.zip
        Expand-Archive procdump.zip -DestinationPath procdump
        echo "${{ github.workspace }}\procdump" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: dlls
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $needed = (& "dumpbin.exe" /dependents PhoenixEngine.exe) 2>&1
        Write-Host $needed
        foreach ($line in $needed) {
          if ($line -match '^\s+(\S+\.dll)') {
            $dll = $matches[1]
            $found = Get-Command $dll -ErrorAction SilentlyContinue
            if (-not $found) {
              Write-Host "MISSING $dll"
            }
          }
        }

    - name: Doc Gen (Windows)
      if: runner.os == 'Windows'
      continue-on-error: true
      shell: pwsh
      run: |
        & ".\PhoenixEngine.exe" --headless --tool scripts/ci/docs.luau
        Write-Host "Exit code: $LASTEXITCODE"

    - name: upload crash dump (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v6
      with:
        name: "crashdump-${{ matrix.build_type }}"
        path: |
          *.dmp
          build/${{ matrix.build_type }}/PhoenixEngine.pdb
        if-no-files-found: ignore
        retention-days: 1

    - name: Test (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        "PhoenixEngine.exe" --headless --tool scripts/ci/tests.luau
        "PhoenixEngine.exe" --headless -ed_ci

    - name: Doc Gen (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: "./PhoenixEngine --headless --tool scripts/ci/docs.luau"

    - name: Test (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: >
        ./PhoenixEngine --headless --tool scripts/ci/tests.luau
